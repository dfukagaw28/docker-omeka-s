; Base PHP settings for Omeka S (environment-specific overrides live in
; config/<env>/php.ini and are mounted as conf.d/zz-env.ini).
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED
memory_limit = 256M
upload_max_filesize = 100M
post_max_size = 110M
max_execution_time = 120
date.timezone = ${TZ}

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
