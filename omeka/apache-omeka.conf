# Omeka S runs behind a reverse proxy (Caddy on the host).
# The container port is published on 127.0.0.1 only, so every request comes
# through the proxy and its X-Forwarded-* headers can be trusted.
ServerTokens Prod
ServerSignature Off

RemoteIPHeader X-Forwarded-For
# (0.0.0.0/0 is rejected by mod_remoteip, hence two halves)
RemoteIPInternalProxy 0.0.0.0/1 128.0.0.0/1

# Let PHP know the original request was HTTPS, so that Omeka (and IIIF
# manifests) generate https:// URLs.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

<Directory /var/www/html>
    AllowOverride All
</Directory>
