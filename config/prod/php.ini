; PHP overrides for the production server (plenty of memory).
; memory_limit is per request / background job (e.g. BulkImport). Smaller
; servers, e.g. about 2 GB of RAM for Omeka: 512M.
memory_limit = 2G
upload_max_filesize = 500M
post_max_size = 510M
max_execution_time = 300
opcache.memory_consumption = 128
